[build]
  command = "npm run build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist", "@electric-sql/pglite", "pg", "pdf-parse", "bcryptjs", "jsonwebtoken"]
  included_files = ["node_modules/pdfjs-dist/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200